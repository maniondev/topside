<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topside — Puzzle Games</title>
<meta name="description" content="Topside makes puzzle games for iOS and Android. Logic puzzles that are harder than they look and even harder to put down.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:  #F0EAE0;
    --red:    #E5384A;
    --orange: #EA862A;
    --gold:   #DFB945;
    --text:   #1E1410;
    --muted:  #7A6050;
    --card-bg: rgba(255,252,246,0.7);
    --card-border: rgba(90,68,32,0.12);
  }

  html, body { height: 100%; }

  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(90,68,32,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,68,32,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .stripe {
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, var(--red) 0%, var(--orange) 50%, var(--gold) 100%);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 24px;
    text-align: center;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(72px, 18vw, 110px);
    letter-spacing: -1px;
    line-height: 1;
    color: var(--text);
  }

  .tagline {
    margin-top: 10px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 3vw, 15px);
    letter-spacing: 0.18em;
    color: var(--muted);
  }

  .divider {
    margin: 24px auto;
    width: 40px;
    height: 2px;
    border-radius: 1px;
    background: linear-gradient(90deg, var(--red), var(--gold));
  }

  .games {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 360px;
  }

  .game-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    text-decoration: none;
    color: var(--text);
    backdrop-filter: blur(4px);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .game-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(90,40,10,0.10);
    border-color: rgba(90,68,32,0.22);
  }

  .game-card:active { transform: scale(0.98); }

  .game-icon {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--cream);
  }

  .game-icon img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .game-info {
    flex: 1;
    text-align: left;
  }

  .game-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }

  .game-desc {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }

  .game-badge {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--muted);
    background: rgba(90,68,32,0.08);
    padding: 3px 8px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .game-badge.coming-soon {
    color: var(--orange);
    background: rgba(234,134,42,0.10);
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 24px 20px;
    flex-shrink: 0;
  }

  .footer-links {
    font-size: 11px;
    color: var(--muted);
  }

  .footer-links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

  main > * { animation: rise 0.55s ease both; }
  .wordmark   { animation-delay: 0s; }
  .tagline    { animation-delay: 0.07s; }
  .divider    { animation-delay: 0.12s; }
  .games      { animation-delay: 0.18s; }
  footer      { animation: rise 0.55s ease both; animation-delay: 0.24s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="stripe"></div>

<main>
  <h1 class="wordmark">Topside</h1>
  <p class="tagline">Puzzle Games</p>
  <div class="divider"></div>

  <div class="games">
    <a href="/original" class="game-card">
      <div class="game-icon">
        <img src="logo.svg" alt="Topside icon">
      </div>
      <div class="game-info">
        <p class="game-name">Topside</p>
        <p class="game-desc">The cube logic puzzle</p>
      </div>
      <span class="game-badge">iOS</span>
    </a>

    <a href="/dicedrop" class="game-card">
      <div class="game-icon">
        <img src="dicedrop/logo.svg" alt="Topside: Dice Drop icon">
      </div>
      <div class="game-info">
        <p class="game-name">Topside: Dice Drop</p>
        <p class="game-desc">A drop and merge game</p>
      </div>
      <span class="game-badge coming-soon">Coming Soon</span>
    </a>
  </div>
</main>

<footer>
  <p class="footer-links">&copy; 2026 Topside</p>
</footer>

</body>
</html>
