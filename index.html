<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topside Games</title>
<meta name="description" content="Topside Games — Independent mobile games for iOS and Android.">
<meta property="og:title" content="Topside Games">
<meta property="og:description" content="Independent mobile games for iOS and Android.">
<meta property="og:image" content="https://topside.games/og-image.png">
<meta property="og:url" content="https://topside.games">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://topside.games/og-image.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:  #F0EAE0;
    --red:    #E5384A;
    --orange: #EA862A;
    --gold:   #DFB945;
    --text:   #1E1410;
    --muted:  #7A6050;
    --card-bg: rgba(255,252,246,0.7);
    --card-border: rgba(90,68,32,0.12);
  }

  html {
    background-color: var(--cream);
    background-image:
      linear-gradient(rgba(240,234,224,0.50), rgba(240,234,224,0.50)),
      url('bg.svg');
    background-size: auto, 300%;
    background-position: 0 0, top left;
    background-repeat: no-repeat, no-repeat;
  }

  body {
    min-height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
  }

  .stripe {
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, var(--red) 0%, var(--orange) 50%, var(--gold) 100%);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 24px 32px;
    text-align: center;
  }

  .logo {
    width: clamp(200px, 38vw, 320px);
    height: clamp(200px, 38vw, 320px);
    margin-top: 0;
    margin-bottom: calc(-9% + 20px);
    animation: rise 0.55s ease both, float 4s 0.55s ease-in-out infinite;
    filter: none;
  }

  @media (max-width: 767px) {
    main { padding-top: 8px; }
    .logo { margin-bottom: calc(-14% + 20px); }
  }

  @media (min-width: 768px) {
    main { padding-top: 6px; }
    .logo { margin-bottom: -60px; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
  }

  .wordmark {
    margin-bottom: 12px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(104px, 26vw, 156px);
    letter-spacing: -1px;
    line-height: 1;
    color: #4A3020;
  }

  .tagline {
    margin-top: 8px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(15px, 3.5vw, 18px);
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  .divider {
    margin: 20px auto;
    width: 40px;
    height: 2px;
    border-radius: 1px;
    background: linear-gradient(90deg, var(--red), var(--gold));
  }

  .games {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 380px;
  }

  .game-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    backdrop-filter: blur(4px);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .game-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(90,40,10,0.10);
    border-color: rgba(90,68,32,0.22);
  }

  .game-card:active { transform: scale(0.98); }

  .game-icon {
    width: 60px;
    height: 60px;
    border-radius: 13px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .game-icon img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .game-info {
    flex: 1;
    text-align: left;
  }

  .game-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }

  .game-desc {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    white-space: nowrap;
  }

  .game-badge {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--muted);
    background: rgba(90,68,32,0.08);
    padding: 3px 8px;
    border-radius: 20px;
    flex-shrink: 0;
    text-align: center;
    line-height: 1.4;
  }

  .game-badge.coming-soon {
    color: var(--orange);
    background: rgba(234,134,42,0.10);
  }

  .game-badges {
    display: flex;
    flex-direction: row;
    gap: 5px;
    flex-shrink: 0;
  }

  .game-badge.ios {
    color: #4A3020;
    background: rgba(74,48,32,0.10);
    padding: 7px 10px;
  }

  .game-badge.android {
    color: var(--red);
    background: rgba(229,56,74,0.10);
    padding: 7px 10px;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 24px calc(16px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0;
  }

  .footer-links {
    font-size: 11px;
    color: var(--muted);
  }

  main > * { animation: rise 0.55s ease both; }
  .logo       { animation-delay: 0s; }
  .wordmark   { animation-delay: 0.07s; }
  .tagline    { animation-delay: 0.12s; }
  .divider    { animation-delay: 0.16s; }
  .games      { animation-delay: 0.21s; }
  footer      { animation: rise 0.55s ease both; animation-delay: 0.26s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="stripe"></div>

<main>
  <img src="logo.svg" alt="Topside cube logo" class="logo">
  <h1 class="wordmark">Topside<sup style="font-size:0.2em;vertical-align:super;letter-spacing:0;">™</sup></h1>
  <p class="tagline">Games</p>
  <div class="divider"></div>

  <div class="games">
    <a href="/classic" class="game-card">
      <div class="game-icon">
        <img src="og-image.png" alt="Topside: Classic icon">
      </div>
      <div class="game-info">
        <p class="game-name" style="font-family:'Cormorant Garamond',serif;font-weight:600;">Classic</p>
        <p class="game-desc">The cube logic puzzle</p>
      </div>
      <div class="game-badges">
        <span class="game-badge android">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-label="Android" style="display:block;">
            <path d="M5 3v18l15-9z"/>
          </svg>
        </span>
        <span class="game-badge ios">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-label="iOS" style="display:block;">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
        </span>
      </div>
    </a>

    <a href="/dicedrop" class="game-card">
      <div class="game-icon">
        <img src="dicedrop/icon-main.png" alt="Topside: Dice Drop icon">
      </div>
      <div class="game-info">
        <p class="game-name" style="font-family:'Cormorant Garamond',serif;font-weight:600;">Dice Drop</p>
        <p class="game-desc">A drop and merge game</p>
      </div>
      <span class="game-badge ios">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-label="iOS" style="display:block;">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
        </span>
    </a>

    <a href="/rokudoku" class="game-card">
      <div class="game-icon">
        <img src="rokudoku/icon.png" alt="Topside: Rokudoku icon">
      </div>
      <div class="game-info">
        <p class="game-name" style="font-family:'Cormorant Garamond',serif;font-weight:600;">Rokudoku</p>
        <p class="game-desc">A sudoku puzzle, reimagined</p>
      </div>
      <span class="game-badge coming-soon">Coming<br>Soon</span>
    </a>

    <a href="/kids" class="game-card">
      <div class="game-icon">
        <img src="kids-icon.png" alt="Topside: Kids icon">
      </div>
      <div class="game-info">
        <p class="game-name" style="font-family:'Cormorant Garamond',serif;font-weight:600;">Kids</p>
        <p class="game-desc">Games for little learners</p>
      </div>
      <span class="game-badge coming-soon">Coming<br>Soon</span>
    </a>
  </div>
</main>

<footer>
  <p class="footer-links">&copy; 2026 John Manion &nbsp;&middot;&nbsp; <a href="/contact">Contact</a></p>
</footer>

</body>
</html>
